[package]
name = "sketch"
version = "0.1.0"
edition = "2024"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
pulldown-cmark = { version = "0.12", default-features = false, features = ["simd"] }
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
kdl = "6"
clap = { version = "4", features = ["derive"] }
dirs = "6"
ropey = "1"
tree-sitter = "0.24"
tree-sitter-md = { git = "https://github.com/MDeiml/tree-sitter-markdown", tag = "v0.3.2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
agent-client-protocol = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time"] }
tokio-util = { version = "0.7", features = ["compat"] }
shell-words = "1"
futures = "0.3"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
gpui = "0.2"

[features]
# Opt-in pass-through of ACP's unstable token / cost surfacing. When this
# feature is enabled, the agent window's `ReplyEvent::UsageUpdated` emitter
# in `acp_channel.rs` fires; otherwise the variant exists but never gets
# constructed (spec-agent-window.md §31). The variant itself is
# unconditional so `match ev` arms stay exhaustive regardless.
unstable_session_usage = ["agent-client-protocol/unstable_session_usage"]

[dev-dependencies]
pretty_assertions = "1"
insta = "1"
tempfile = "3"
gpui = { version = "0.2", features = ["test-support"] }

[[bin]]
name = "sketch"
path = "src/main.rs"

[[bin]]
name = "sketch-channel"
path = "src/bin/sketch-channel.rs"

[[bin]]
name = "sketch-gpui"
path = "src/bin/sketch-gpui/main.rs"
required-features = []

[[bin]]
name = "sketch-session-server"
path = "src/bin/sketch-session-server/main.rs"

# Test-support stub ACP agent. Speaks the agent side of the Agent Client
# Protocol over stdio (NDJSON) just enough to satisfy sketch's client, so the
# headless session-server harness can drive a real transcript without a live
# Claude agent. Integration tests find it via env!("CARGO_BIN_EXE_sketch-acp-stub").
[[bin]]
name = "sketch-acp-stub"
path = "src/bin/sketch-acp-stub.rs"
