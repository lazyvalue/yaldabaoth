[package]
name = "sketch"
version = "0.1.0"
edition = "2024"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
pulldown-cmark = { version = "0.12", default-features = false, features = ["simd"] }
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
kdl = "6"
clap = { version = "4", features = ["derive"] }
dirs = "6"
ropey = "1"
tree-sitter = "0.24"
tree-sitter-md = { git = "https://github.com/MDeiml/tree-sitter-markdown", tag = "v0.3.2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
pretty_assertions = "1"
insta = "1"
tempfile = "3"

[[bin]]
name = "sketch"
path = "src/main.rs"

[[bin]]
name = "sketch-channel"
path = "src/bin/sketch-channel.rs"
