[package]
name = "yalda"
version = "0.1.0"
edition = "2024"

[dependencies]
pulldown-cmark ={ version = "0.12", default-features = false, features = ["simd"] }
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
kdl = "6"
clap = { version = "4", features = ["derive"] }
dirs = "6"
ropey = "1"
tree-sitter = "0.24"
tree-sitter-md = { git = "https://github.com/MDeiml/tree-sitter-markdown", tag = "v0.3.2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
ureq = { version = "2", features = ["json"] }
agent-client-protocol = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time"] }
tokio-util = { version = "0.7", features = ["compat"] }
shell-words = "1"
futures = "0.3"
# Persistent (structurally-shared) vector for the session event log: O(1) clone
# + O(log n) append even while a snapshot is shared with the forwarder watch.
# Replaces `Arc<Vec>`, whose copy-on-write deep-cloned the whole log on every
# append once a snapshot was outstanding (O(n²) over a session — the FoF stall).
imbl = "5"
uuid = { version = "1", features = ["v4"] }
libc = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
merman = { version = "0.6.2", features = ["raster"] }

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
gpui = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "=0.26.0"
objc = "0.2"

[features]
# ON by default: without it `ReplyEvent::UsageUpdated` never fires, so the
# context-window usage bar in the agent view has no data and never renders.
# The agent view's whole context indicator depends on this, so it ships
# enabled (spec-agent-window.md §31).
default = ["unstable_session_usage"]
# Pass-through of ACP's unstable token / cost surfacing. When enabled, the
# agent window's `ReplyEvent::UsageUpdated` emitter in `acp_channel.rs` fires;
# otherwise the variant exists but never gets constructed. The variant itself
# is unconditional so `match ev` arms stay exhaustive regardless.
unstable_session_usage = ["agent-client-protocol/unstable_session_usage"]

# Phase 6 (spec-session-server-actor §Rollout): exposes the in-process
# `FakeTransport` / `FakeAgentControls` / `FakeAgentSpawner` test substrate in
# `acp_channel`. The fake injects at the `ReplyEvent` layer (the post-deserialize
# currency the pump consumes), so a harness can exercise the pump / reducer /
# forwarder without spawning a real ACP subprocess. Off by default; integration
# tests opt in via `required-features`.
test-support = []

[dev-dependencies]
pretty_assertions = "1"
insta = "1"
tempfile = "3"
gpui = { version = "0.2", features = ["test-support"] }
criterion = "0.5"

# Release-mode perf gate (verification-harness gap #3): markdown render +
# highlight over a realistic-size document — the lib hot paths the transcript
# and doc views run. `cargo bench --bench render_bench`. Debug masks wins, so
# this MUST be measured optimized (criterion builds the bench in release).
[[bench]]
name = "render_bench"
harness = false

[[bin]]
name = "yalda-channel"
path = "src/bin/yalda-channel.rs"

[[bin]]
name = "yalda-gpui"
path = "src/bin/yalda-gpui/main.rs"
required-features = []

[[bin]]
name = "yalda-session-server"
path = "src/bin/yalda-session-server/main.rs"

# Test-support stub ACP agent. Speaks the agent side of the Agent Client
# Protocol over stdio (NDJSON) just enough to satisfy yalda's client, so the
# headless session-server harness can drive a real transcript without a live
# Claude agent. Integration tests find it via env!("CARGO_BIN_EXE_yalda-acp-stub").
[[bin]]
name = "yalda-acp-stub"
path = "src/bin/yalda-acp-stub.rs"

# Phase 6: in-process AgentTransport-fake tests. Gated on `test-support` so the
# fake substrate (FakeTransport / FakeAgentControls / FakeAgentSpawner) is
# compiled in. Run with `cargo test --features test-support`.
[[test]]
name = "agent_transport_fake_test"
path = "tests/agent_transport_fake_test.rs"
required-features = ["test-support"]

[[test]]
name = "agent_event_stream_test"
path = "tests/agent_event_stream_test.rs"
required-features = ["test-support"]

# Optimize DEPENDENCIES even in dev/debug builds. GPUI is immediate-mode: it
# re-runs full-window layout (Taffy) + glyph shaping + paint every frame, and
# nearly all of that per-frame cost lives in dependencies (gpui, taffy, the text
# stack, ropey). Compiling THOSE unoptimized makes a debug build stutter on fast
# text input even though yalda's own per-keystroke work is O(1). The `"*"` glob
# applies only to dependencies — yalda's own crates stay at the default dev
# opt-level 0, so incremental rebuilds of our code remain fast and debuggable,
# while the per-frame hot path runs at release speed. NOTE: the first dev build
# after adding this recompiles every dependency optimized (one-time, ~release dep
# build); incremental builds of our code are fast thereafter.
[profile.dev.package."*"]
opt-level = 3
