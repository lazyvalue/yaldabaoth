name: CI

# The most minimal gate that would have caught the regression class: every push
# and PR must COMPILE (both binaries) and PASS TESTS. Nothing more, on purpose —
# a green-from-day-one gate that turns "a human happens to run the app" into "the
# machine checked it." Tighten later (see the commented `quality` job below).
on:
  push:
  pull_request:

# Cancel superseded runs on the same ref so a fast push series doesn't queue up.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    # macOS matches the GPUI/darwin target the app actually ships on, and avoids
    # the Linux GPUI system-dep rabbit hole. Keep it single-OS for minimality.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2 # caches ~/.cargo + target/, keeps runs fast
      - name: CI gate (build + test)
        run: bash scripts/ci.sh # same gate as the local .githooks/pre-push hook

  # ── Quality gate: tree is clippy-clean and fmt-clean as of 2026-06-08, so this
  # stays green. clippy runs with --features test-support because the in-process
  # FakeTransport test targets are gated behind that feature. ──────────────────
  quality:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --features test-support -- -D warnings

  # ── Mutation gate (the mechanical anti-lying enforcement) ────────────────────
  # Mutation-tests ONLY the lines a PR changes in the input-routing predicates
  # (mutants.toml scopes the files; `--in-diff` scopes to the diff). A surviving
  # mutant = changed code a test does not actually constrain = the "green-both-ways"
  # class that let four fixes ship broken. PR-only (needs a base to diff against);
  # `--in-diff` means it never fails on pre-existing survivors, only on NEW gaps.
  mutation-gate:
    if: github.event_name == 'pull_request'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need the base ref to compute the diff
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-mutants --locked
      - name: Mutation-test the changed lines
        run: |
          git diff "origin/${{ github.base_ref }}...HEAD" > /tmp/pr.diff
          if grep -qE '^\+\+\+ b/src/bin/yalda-gpui/(agent|agent_ui|main)\.rs' /tmp/pr.diff; then
            cargo mutants --in-diff /tmp/pr.diff --features test-support
          else
            echo "No changes to the gated predicates — mutation gate skipped."
          fi
